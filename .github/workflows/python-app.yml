# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.11.15
      uses: actions/setup-python@v3
      with:
        python-version: "3.11.15"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        pytest
    - name: Streamlit frontend smoke test
      run: |
        streamlit run streamlit_app.py --server.headless true --server.port 8501 &
        STREAMLIT_PID=$!

        echo "Waiting for the Streamlit frontend to open..."
        SUCCESS=false
        for i in $(seq 1 10); do
          if curl -sf http://localhost:8501 > /dev/null; then
            SUCCESS=true
            break
          fi
          sleep 1
        done

        kill "$STREAMLIT_PID" 2>/dev/null || true

        if [ "$SUCCESS" = true ]; then
          echo "✅ Streamlit frontend opened successfully"
        else
          echo "❌ Streamlit frontend did not respond"
          exit 1
        fi
