name: Docker Image CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Target Docker Hub repository: <username>/<repo-name>
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/job-matcher

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Generate tags: "latest" (main only) + short commit SHA
      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # 1) Build: the image is loaded into the runner's local Docker (not pushed yet)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Smoke test: the container must actually answer GET /health with
      #    {"status": "ok"} within a few seconds, not just stay alive.
      # GOOGLE_API_KEY reuses the same repository secret as the pytest job
      # (GOOGLE_MODEL/DATABASE_URL fall back to the defaults in app/config.py)
      - name: Container smoke test
        run: |
          IMAGE_TAG="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          echo "Testing image: $IMAGE_TAG"

          docker run -d --name smoke-test -e GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}" -p 8000:8000 "$IMAGE_TAG"

          echo "Waiting for /health to respond..."
          SUCCESS=false
          for i in $(seq 1 10); do
            RESPONSE=$(curl -sf http://localhost:8000/health 2>/dev/null) || true
            if [ -n "$RESPONSE" ] && echo "$RESPONSE" | jq -e '.status == "ok"' > /dev/null 2>&1; then
              SUCCESS=true
              break
            fi
            sleep 1
          done

          echo "----- Container logs -----"
          docker logs smoke-test
          echo "--------------------------"

          docker rm -f smoke-test > /dev/null

          if [ "$SUCCESS" = true ]; then
            echo "Response: $RESPONSE"
            echo "✅ Smoke test passed — /health responded with status ok"
          else
            echo "❌ Smoke test failed — /health never returned a healthy response"
            exit 1
          fi

      # 3) Login and push: ONLY on push to main (never on pull requests)
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags ${{ env.IMAGE }}
